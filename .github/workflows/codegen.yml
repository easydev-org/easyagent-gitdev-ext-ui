name: proto

# KEEPS THIS REPOSITORY'S CONTRACT IN STEP WITH THE BACKEND'S.
#
# The .proto here is a COPY of easyagent-gitdev-ext/proto/ui/v1/ui.proto. A copy that drifts is exactly
# the failure this whole arrangement exists to remove: a generated client that disagrees with a
# generated server, with no error on either side and an empty page at the end.
#
# So the copy is never trusted — it is COMPARED against the backend on every run, and regenerated.

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - '.github/workflows/codegen.yml'
  pull_request:
    paths:
      - 'proto/**'
  # The backend can change without this repository being touched, so there has to be a clock.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  BACKEND: easydev-org/easyagent-gitdev-ext
  PROTO_PATH: ui/v1/ui.proto

jobs:
  codegen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole point is to commit the regenerated output, so a detached head would need a
          # second checkout.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci --no-audit --no-fund

      # FETCH THE BACKEND'S PROTO AND COMPARE, rather than assuming this copy is current. The token is
      # only needed because the backend repository is private; for a public one the header can go.
      - name: is the copy still the contract?
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream="https://raw.githubusercontent.com/${BACKEND}/main/proto/${PROTO_PATH}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$upstream" -o /tmp/upstream.proto
          if diff -q /tmp/upstream.proto "proto/${PROTO_PATH}" >/dev/null; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "the copy matches the backend"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the backend's proto has changed; taking theirs"
            diff -u "proto/${PROTO_PATH}" /tmp/upstream.proto || true
            cp /tmp/upstream.proto "proto/${PROTO_PATH}"
          fi

      # ALWAYS REGENERATE, even when the copy matched: the plugins' own versions move, and a client
      # generated by an older plugin against the same proto is not the same client.
      - name: generate
        run: |
          set -euo pipefail
          cd proto
          buf lint
          buf generate

      - name: types and build
        run: |
          set -euo pipefail
          npm run check
          npm run build

      # THE BUILT BUNDLE IS THE PRODUCT, so it is published as an artifact rather than left in a
      # .gitignore'd dist/. The extension's Go binary embeds it, and its build must not need Node: it
      # downloads ui.tar.gz from here and unrolls it into ui/.
      #
      # A TARBALL, NOT dist/ COMMITTED. Committing build output puts a generated directory in every
      # diff and gives no version to pin; an artifact has a tag and a digest.
      - name: pack the bundle
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::vite produced no dist/index.html"; exit 1; }
          tar -czf ui.tar.gz -C dist .
          echo "packed $(find dist -type f | wc -l) files, $(du -h ui.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: ui.tar.gz
          retention-days: 30

      # A RELEASE ON EVERY TAG, carrying the bundle. That is the thing the Go build pins.
      - name: publish the bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" ui.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "The built panel. Pinned by easyagent-gitdev-ext's ui/fetch-ui.sh via UI_VERSION."

      # A PULL REQUEST, NOT A PUSH TO MAIN. Generated code landing on main unreviewed is how a
      # contract change becomes invisible; a PR makes the diff — and the fact that it happened — the
      # thing somebody signs off on.
      - name: open the pull request
        if: steps.drift.outputs.same == 'false' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to commit — the generated client already matches"
            exit 0
          fi
          branch="proto/sync-$(date +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: regenerate the client from the backend's proto

The .proto in this repository is a copy of ${BACKEND}'s, and it no longer matched. Ingested the
backend's version and regenerated, so the client and the server cannot disagree about a field name
— which is the failure that produced an empty file tree once already."
          git push -u origin "$branch"
          gh pr create --title "chore: sync the proto from the backend" --body "$(cat <<'BODY'
This pull request was opened by CI because `${BACKEND}`'s \`proto/${PROTO_PATH}\` changed.

**What happened**

1. Fetched the backend's proto and compared it with this repository's copy.
2. They differed, so the backend's version replaced the copy.
3. Regenerated \`src/gen/\` with buf, and re-ran the type check and the build.

**Why a pull request and not a push**

A contract change that lands on main unreviewed is invisible. The diff is the thing to read: a field
that was renamed, a type that widened, an RPC that appeared. If the panel needs a change to match, it
will fail to type-check here — which is the point, and it is better seen now than in production.
BODY
)"
