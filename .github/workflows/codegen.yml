name: proto

# KEEPS THIS REPOSITORY'S CONTRACT IN STEP WITH THE BACKEND'S.
#
# The .proto here is a COPY of easyagent-gitdev-ext/proto/ui/v1/ui.proto. A copy that drifts is exactly
# the failure this whole arrangement exists to remove: a generated client that disagrees with a
# generated server, with no error on either side and an empty page at the end.
#
# So the copy is never trusted — it is COMPARED against the backend on every run, and regenerated.

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - '.github/workflows/codegen.yml'
  pull_request:
    paths:
      - 'proto/**'
  # The backend can change without this repository being touched, so there has to be a clock.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  BACKEND: easydev-org/easyagent-gitdev-ext
  PROTO_PATH: ui/v1/ui.proto

jobs:
  codegen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole point is to commit the regenerated output, so a detached head would need a
          # second checkout.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci --no-audit --no-fund

      # COMPARE THIS COPY AGAINST THE BACKEND'S — when the backend is readable.
      #
      # GITHUB_TOKEN SCOPES TO THIS REPOSITORY ONLY, so a private backend is a 404 here no matter
      # what header is sent. A hard failure on that would mean this workflow could never go green,
      # which is the same as having no workflow; so a backend that cannot be read is reported and the
      # check is SKIPPED, not failed.
      #
      # For a private backend, set a token with read access to it as `PROTO_READ_TOKEN`; with one, the
      # comparison runs and a drift opens the pull request. Without one, the schedule still regenerates
      # and the type check still catches a client that no longer matches its own generated code.
      - name: is the copy still the contract?
        id: drift
        env:
          PROTO_READ_TOKEN: ${{ secrets.PROTO_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          upstream="https://raw.githubusercontent.com/${BACKEND}/main/proto/${PROTO_PATH}"
          tok="${PROTO_READ_TOKEN:-$GH_TOKEN}"
          code=$(curl -sS -o /tmp/upstream.proto -w '%{http_code}' -H "Authorization: Bearer ${tok}" "$upstream" || true)
          if [ "$code" != "200" ]; then
            echo "same=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot read ${BACKEND}'s proto (HTTP $code). Set PROTO_READ_TOKEN with access to that repository to enable the drift check. Skipping it rather than failing: a check that can never pass is not a check."
            exit 0
          fi
          if diff -q /tmp/upstream.proto "proto/${PROTO_PATH}" >/dev/null; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "the copy matches the backend"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the backend's proto has changed; taking theirs"
            diff -u "proto/${PROTO_PATH}" /tmp/upstream.proto || true
            cp /tmp/upstream.proto "proto/${PROTO_PATH}"
          fi

      # ALWAYS REGENERATE, even when the copy matched: the plugins' own versions move, and a client
      # generated by an older plugin against the same proto is not the same client.
      - name: generate
        run: |
          set -euo pipefail
          cd proto
          # THE PLUGIN LIVES IN node_modules/.bin, WHICH IS NOT ON PATH. buf invokes plugins by name,
          # so without this it fails with `exec: "protoc-gen-es": executable file not found` — a
          # message that names the plugin but not where it was expected.
          export PATH="${PWD}/../node_modules/.bin:${PATH}"
          command -v protoc-gen-es >/dev/null || {
            echo "::error::protoc-gen-es is not installed — is it in package.json's devDependencies?"
            exit 1
          }
          buf lint
          buf generate

      - name: types and build
        run: |
          set -euo pipefail
          npm run check
          npm run build

      # THE BUILT BUNDLE IS THE PRODUCT, so it is published as an artifact rather than left in a
      # .gitignore'd dist/. The extension's Go binary embeds it, and its build must not need Node: it
      # downloads ui.tar.gz from here and unrolls it into ui/.
      #
      # A TARBALL, NOT dist/ COMMITTED. Committing build output puts a generated directory in every
      # diff and gives no version to pin; an artifact has a tag and a digest.
      - name: pack the bundle
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::vite produced no dist/index.html"; exit 1; }
          tar -czf ui.tar.gz -C dist .
          echo "packed $(find dist -type f | wc -l) files, $(du -h ui.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: ui.tar.gz
          retention-days: 30

      # A RELEASE ON EVERY TAG, carrying the bundle. That is the thing the Go build pins.
      - name: publish the bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" ui.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "The built panel. Pinned by easyagent-gitdev-ext's ui/fetch-ui.sh via UI_VERSION."

      # A PULL REQUEST, NOT A PUSH TO MAIN. Generated code landing on main unreviewed is how a
      # contract change becomes invisible; a PR makes the diff — and the fact that it happened — the
      # thing somebody signs off on.
      - name: open the pull request
        if: steps.drift.outputs.same == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to commit — the generated client already matches"
            exit 0
          fi
          branch="proto/sync-$(date +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          # THE MESSAGE GOES IN A FILE, not in a heredoc inside `run:`. A multi-line quoted string in
          # a YAML block scalar broke this workflow outright — GitHub reported the run as failed with
          # ZERO jobs, which says nothing about the syntax error that caused it.
          {
            echo "chore: regenerate the client from the backend's proto"
            echo
            echo "The .proto here is a copy of ${BACKEND}'s and no longer matched. Ingested theirs and"
            echo "regenerated, so client and server cannot disagree about a field name."
          } > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push -u origin "$branch"
          {
            echo "Opened by CI because \`${BACKEND}\`'s \`proto/${PROTO_PATH}\` changed."
            echo
            echo "**What happened**"
            echo
            echo "1. Fetched the backend's proto and compared it with this repository's copy."
            echo "2. They differed, so the backend's version replaced the copy."
            echo "3. Regenerated \`src/gen/\` with buf, and re-ran the type check and the build."
            echo
            echo "**Why a pull request and not a push**"
            echo
            echo "A contract change that lands on main unreviewed is invisible. The diff is the thing"
            echo "to read: a field renamed, a type widened, an RPC appeared. If the panel needs a change"
            echo "to match it, the type check fails here — which is the point, and better seen now."
          } > /tmp/body.md
          gh pr create --title "chore: sync the proto from the backend" --body-file /tmp/body.md
