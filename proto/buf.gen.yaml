version: v2
# The TypeScript side of the UI contract, generated from the SAME .proto as the Go backend.
#
# THE FILE IS A COPY, and proto/sync.sh keeps it byte-identical to the backend's. A generated client
# that disagrees with a generated server is exactly the failure this whole change exists to remove, so
# the copy is verified rather than trusted — see CI.
plugins:
  # ONE PLUGIN, NOT TWO. protoc-gen-es v2 emits the SERVICE DESCRIPTOR alongside its messages, and
  # @connectrpc/connect's createClient takes that descriptor directly. protoc-gen-connect-es is the v1
  # arrangement — an extra file of object literals — and it pins protobuf v1, which conflicts with the
  # v2 runtime that createClient needs. Keeping both was not a style choice: it was an unresolvable
  # peer dependency.
  - local: protoc-gen-es
    out: ../src/gen
    opt:
      - target=ts
      - import_extension=js
